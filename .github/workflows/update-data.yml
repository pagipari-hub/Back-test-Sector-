name: Update Sector Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 14 * * 5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update daily data
        run: python src/download_data.py

      - name: Build weekly data
        run: python src/weekly_data.py

      - name: Validate historical data
        run: python src/validate_data.py

      - name: Commit updated data and validation report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No new market data or validation changes. Nothing to commit."
          else
            git commit -m "Update and validate sector market data"
            git push
          fi
