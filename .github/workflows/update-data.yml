name: Update Sector Data

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh benchmark and sector datasets
        run: |
          python src/download_data.py
          python src/update_from_yahoo.py

      - name: Rebuild weekly aggregates
        run: python src/weekly_data.py

      - name: Validate historical data
        run: python src/validate_data.py

      - name: Run backtest sanity suite
        run: python src/backtest.py

      - name: Commit updated data, validation and backtest reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ backtest/
          git status --short
          if git diff --cached --quiet; then
            echo "No new data or report changes. Nothing to commit."
          else
            git commit -m "Update data validation and backtest reports"
            git push
          fi
